<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101014">
  <title>Halaman</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100svh; display: grid; place-items: center;
      padding: 24px; background: radial-gradient(circle at top, #292936 0, #101014 55%, #08080a 100%);
      color: #f6f6f8; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }
    main { width: min(100%, 560px); text-align: center; }
    .photo {
      display: block; width: 100%; max-height: 68svh; object-fit: contain;
      border-radius: 18px; border: 1px solid #393944;
      box-shadow: 0 18px 60px #0009;
    }
    h1 { margin: 22px 0 8px; font-size: clamp(1.8rem, 7vw, 3.1rem); line-height: 1.05; letter-spacing: -.04em; }
    h1 span { color: #ff343f; }
    p { margin: 0; color: #c6c6d0; font-size: 1rem; }
    .tag { display: inline-block; margin-top: 18px; padding: 7px 12px; border: 1px solid #454552; border-radius: 999px; color: #aaaab8; font-size: .8rem; }
  </style>
</head>
<body>
  <main>
    <img class="photo" src="monyet.jpg" alt="Foto gorila sedang bergaya">
    <h1>ANDA KENA PRANK<br><span>SAMA AKBAR 😂</span></h1>
    <p>Tenang, cuma bercanda.</p>
    <div class="tag">AKBAR • PRANK BERHASIL</div>
  </main>
</body>
</html>
